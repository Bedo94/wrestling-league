[remote_databases.produzione]
label = "Produzione"
description = "Database remoto principale con i dati condivisi reali."
url = "postgresql+psycopg://user:password@host:5432/dbname?sslmode=require"

[remote_databases.staging]
label = "Staging"
description = "Database remoto per test controllati prima dell'uso operativo."
url = "postgresql+psycopg://user:password@host:5432/dbname?sslmode=require"

[remote_databases.backup_personale]
label = "Backup personale"
description = "Copia remota personale usata per backup o verifiche manuali."
url = "postgresql+psycopg://user:password@host:5432/dbname?sslmode=require"